    background-size:cover;
    background-position:top center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    background-color:var(--navy-deep);
    color:var(--paper);
    font-family:'Jost', sans-serif;
    padding:6vh 20px;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  .logo-img{
    width:100%; max-width:340px; height:auto; display:block; margin:0 auto 6px;
  }
  .back-link{
    display:block; text-align:center; color:var(--gold-bright);
    font-size:13px; text-decoration:none; margin:10px 0 28px; letter-spacing:0.5px;
  }
  .back-link:hover{ text-decoration:underline; }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(24px, 6vw, 32px);
    text-align:center;
    color:var(--gold-bright);
    margin:0 0 20px;
  }
  .gallery{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    margin-bottom:24px;
  }
  .gal-img{
    width:100%;
    border:1px solid var(--navy-line);
    border-radius:10px;
    overflow:hidden;
    background:rgba(0,0,0,0.2);
  }
  .gal-img img{
    width:100%;
    height:auto;
    display:block;
  }
  .desc{
    font-size:15px;
    line-height:1.7;
    color:var(--silver);
    font-weight:300;
    text-align:left;
  }
  footer{
    margin-top:48px; text-align:center; font-size:11px; letter-spacing:1.5px;
    color:var(--navy-line); text-transform:uppercase;
  }
  footer span{ color:var(--gold-bright); }
</style>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAFICI! — Functions &amp; Domains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Luckiest+Guy&family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a1c30;
  --panel:#0f2a47;
  --panel-light:#153a5e;
  --chalk:#e7eef7;
  --chalk-dim:#9fb3cc;
  --c-graph:#d4213d;
  --c-domain:#1b3a86;
  --c-range:#167a41;
  --c-range-table:#d8ea6b;
  --c-domain-table:#8ec4ff;
  --c-equation-table:#5eeaff;
  --c-equation:#0e9bc4;
  --c-function:#c31577;
  --paper:#fbf9f4;
  --gold:#f0b429;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(255,255,255,0.04), transparent 45%),
    linear-gradient(160deg, #081527 0%, #0a1c30 45%, #0d2440 100%);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  position:relative;
}
/* subtle chalk scribble texture */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:0.05;
  background-image:
    repeating-linear-gradient(35deg, transparent 0 38px, #fff 39px 40px),
    repeating-linear-gradient(-35deg, transparent 0 60px, #fff 61px 62px);
  mix-blend-mode:overlay;
}
/* campo stellato dorato in stile Mathmorethanmagic.com */
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none;
  background-image:
    radial-gradient(ellipse 560px 360px at 8% 2%, rgba(240,180,41,0.22), transparent 65%),
    radial-gradient(ellipse 460px 340px at 96% 100%, rgba(14,155,196,0.18), transparent 65%),
    radial-gradient(2.6px 2.6px at 8% 15%, #fff, transparent 70%),
    radial-gradient(2.2px 2.2px at 22% 8%, #f6dd9a, transparent 70%),
    radial-gradient(3px 3px at 38% 22%, #fff, transparent 70%),
    radial-gradient(2px 2px at 55% 6%, #f6dd9a, transparent 70%),
    radial-gradient(2.6px 2.6px at 70% 18%, #fff, transparent 70%),
    radial-gradient(2.2px 2.2px at 86% 9%, #f6dd9a, transparent 70%),
    radial-gradient(2.8px 2.8px at 94% 30%, #fff, transparent 70%),
    radial-gradient(2px 2px at 5% 45%, #f6dd9a, transparent 70%),
    radial-gradient(2.6px 2.6px at 18% 60%, #fff, transparent 70%),
    radial-gradient(2.2px 2.2px at 33% 78%, #f6dd9a, transparent 70%),
    radial-gradient(3px 3px at 48% 52%, #fff, transparent 70%),
    radial-gradient(2px 2px at 63% 68%, #f6dd9a, transparent 70%),
    radial-gradient(2.6px 2.6px at 78% 48%, #fff, transparent 70%),
    radial-gradient(2.2px 2.2px at 90% 72%, #f6dd9a, transparent 70%),
    radial-gradient(2.6px 2.6px at 12% 90%, #fff, transparent 70%),
    radial-gradient(2.2px 2.2px at 60% 92%, #f6dd9a, transparent 70%),
    radial-gradient(2.8px 2.8px at 82% 88%, #fff, transparent 70%);
  opacity:0.9;
}
#app{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:18px 16px 40px;}

.site-credit{
  display:flex; align-items:center; justify-content:center; gap:6px; margin:22px 0 4px; opacity:0.8;
  font-size:11px; color:var(--chalk-dim); letter-spacing:0.3px;
}
.site-credit a{
  font-family:'Tangerine',cursive; font-size:22px; font-weight:700; text-decoration:none; line-height:1;
  background:linear-gradient(120deg,#e8c874,#fdf1c8 45%,#c99a3f 55%,#f0dc9e);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 6px rgba(240,200,120,0.25));
}
.site-credit .credit-sub{font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--chalk-dim); font-weight:600;}

/* ---------- HEADER ---------- */
.header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; flex:1; justify-content:center; text-align:center;}
.brand > div{width:100%;}
.brand h1{
  font-family:'Luckiest Guy',cursive; font-weight:400; font-size:clamp(28px,5vw,40px);
  margin:0; letter-spacing:1px; color:#fff; -webkit-text-stroke:1px rgba(10,28,48,0.4);
  text-shadow:0 0 20px rgba(14,155,196,0.4), 3px 3px 0 rgba(6,16,28,0.55);
}
.brand .tag{font-size:11px; letter-spacing:3px; color:var(--chalk-dim); text-transform:uppercase; font-weight:700; margin-top:-2px;}
.menu-btn{
  width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06); font-size:17px; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:background 0.15s, transform 0.15s;
}
.menu-btn:hover{background:rgba(255,255,255,0.14); transform:translateY(-1px);}
.status-pill{
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
  padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:500;
  display:flex; align-items:center; gap:8px; min-height:20px;
}
.status-pill .dot{width:8px;height:8px;border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); flex:none;}
.status-pill.you .dot{background:#3fd17c; box-shadow:0 0 8px #3fd17c;}
.status-pill.computer .dot{background:#e26a6a; box-shadow:0 0 8px #e26a6a;}

/* ---------- ZONES ---------- */
.zone{margin-bottom:16px;}
.zone-label{
  font-size:11px; text-transform:uppercase; letter-spacing:2px; font-weight:700;
  color:var(--chalk-dim); margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.zone-label .count{
  background:rgba(255,255,255,0.08); color:var(--chalk); padding:2px 9px; border-radius:999px; font-size:11px;
}

/* computer zone */
.computer-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; row-gap:10px;}
.card-back-stack{display:flex; flex-wrap:wrap;}
.card-back{
  width:46px; height:64px; border-radius:8px; margin-left:-24px;
  background-image:var(--monster-img); background-size:cover; background-position:center;
  border:2px solid #2f6fa8; position:relative; box-shadow:0 3px 8px rgba(0,0,0,0.4);
}
.card-back:first-child{margin-left:0;}
.deck-counters{
  display:flex; flex-direction:column; gap:5px; margin-left:auto;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:8px 12px; font-size:11.5px; color:var(--chalk-dim);
}

/* ---------- TABLE ---------- */
.computer-drawing{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:rgba(255,255,255,0.05); border:2px dashed rgba(255,255,255,0.2); border-radius:16px;
  padding:14px 12px 16px; margin-bottom:14px; animation:revealPop 0.35s ease;
}
.computer-drawing-card{
  width:46px; height:64px; border-radius:8px;
  background-image:var(--monster-img); background-size:cover; background-position:center;
  border:2px solid #2f6fa8; box-shadow:0 3px 10px rgba(0,0,0,0.4);
  animation:drawPulse 1.3s ease-in-out infinite;
}
@keyframes drawPulse{
  0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-6px) rotate(-3deg);}
}
.computer-drawing-label{font-size:12.5px; color:var(--chalk-dim); text-align:center; font-weight:600;}

.double-error-banner{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:linear-gradient(160deg, rgba(220,50,50,0.28), rgba(120,10,10,0.18));
  border:2px solid #e5484d; border-radius:16px; padding:14px 12px;
  margin-bottom:14px; animation:doubleErrorPop 0.5s cubic-bezier(.36,.07,.19,.97), doubleErrorShake 0.5s 0.1s;
}
@keyframes doubleErrorPop{
  0%{transform:scale(0.6); opacity:0;} 60%{transform:scale(1.06); opacity:1;} 100%{transform:scale(1);}
}
@keyframes doubleErrorShake{
  10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);}
}
.double-error-title{font-family:'Luckiest Guy',cursive; font-size:22px; color:#ff6b6b; letter-spacing:1px; text-shadow:0 0 14px rgba(229,72,77,0.6);}
.double-error-sub{font-size:12.5px; color:#ffcdd2; font-weight:600;}

.computer-reveal{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  background:linear-gradient(160deg, rgba(240,180,41,0.16), rgba(240,180,41,0.05));
  border:2px solid rgba(240,180,41,0.55); border-radius:16px; padding:14px 12px 16px;
  margin-bottom:14px; animation:revealPop 0.4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes revealPop{
  0%{transform:scale(0.7); opacity:0;} 100%{transform:scale(1); opacity:1;}
}
.computer-reveal-label{font-size:12.5px; color:#fde8b8; text-align:center; font-weight:600;}
.computer-reveal-label b{color:var(--gold);}
.computer-reveal-card{animation:revealBounce 1.9s ease-in-out;}
@keyframes revealBounce{
  0%{transform:translateY(-6px);} 15%{transform:translateY(0);} 85%{transform:translateY(0);} 100%{transform:translateY(4px); opacity:0.4;}
}
.computer-reveal-type{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--chalk-dim); font-weight:700;}

.table-wrap{
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 2px, transparent 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,0.045) 0px, rgba(0,0,0,0.045) 1px, transparent 2px, transparent 5px),
    radial-gradient(ellipse 480px 260px at 50% -5%, rgba(255,255,255,0.08), transparent 65%),
    linear-gradient(160deg, #2f6e4c 0%, #2a6244 45%, #235536 100%);
  border:3px solid #3a2413;
  box-shadow:inset 0 0 38px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.07), 0 6px 16px rgba(0,0,0,0.4);
  border-radius:20px; padding:18px; position:relative;
}
.table-wrap .zone-label{color:#fbe9d3;}
.table-wrap .zone-label .count{background:rgba(0,0,0,0.28); color:#fff4e6;}
.table-wrap .pill.range{border-color:var(--c-range-table); color:var(--c-range-table);}
.table-wrap .pill.range.done{background:var(--c-range-table); color:#2e4400;}
.table-wrap .pill.domain{border-color:var(--c-domain-table); color:var(--c-domain-table);}
.table-wrap .pill.domain.done{background:var(--c-domain-table); color:#0a2450;}
.table-wrap .pill.equation{border-color:var(--c-equation-table); color:var(--c-equation-table);}
.table-wrap .pill.equation.done{background:var(--c-equation-table); color:#003944;}
.table-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:10px 6px;
}
.slot{display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:4px; transition:transform 0.25s;}
.slot:nth-child(even){flex-direction:row-reverse;}
.slot.completing{animation:eat 0.7s ease;}
@keyframes eat{
  0%{transform:scale(1);} 40%{transform:scale(1.12) rotate(-2deg); filter:brightness(1.3);} 100%{transform:scale(0.2); opacity:0;}
}
.slot.arriving{animation:flipin 0.5s ease;}
@keyframes flipin{
  0%{transform:rotateY(90deg); opacity:0;} 100%{transform:rotateY(0deg); opacity:1;}
}
.match-pills{display:flex; flex-direction:column; gap:5px; justify-content:center; flex:none;}
.pill{
  width:34px;height:34px;border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700; border:2.25px dashed; opacity:0.85; font-family:'Inter'; flex:none;
}
.pill.done{opacity:1; border-style:solid; color:#fff;}
.pill.domain{border-color:var(--c-domain); color:var(--c-domain);}
.pill.range{border-color:var(--c-range); color:var(--c-range);}
.pill.equation{border-color:var(--c-equation); color:var(--c-equation);}
.pill.function{border-color:var(--c-function); color:var(--c-function);}
.pill.domain.done{background:var(--c-domain);}
.pill.range.done{background:var(--c-range);}
.pill.equation.done{background:var(--c-equation);}
.pill.function.done{background:var(--c-function);}
.pill.jolly-fill{
  background:#fff; border:2px solid var(--gold); color:#a8760a; opacity:1; font-weight:900;
  box-shadow:0 0 8px rgba(240,180,41,0.6); animation:jollyPulse 1.8s ease-in-out infinite;
}
@keyframes jollyPulse{0%,100%{box-shadow:0 0 6px rgba(240,180,41,0.5);} 50%{box-shadow:0 0 14px rgba(240,180,41,0.85);}}

.deck-mini{display:flex; align-items:center; gap:8px;}
.deck-mini .swatch{width:24px;height:32px;border-radius:5px;border:2px solid #2f6fa8; background:linear-gradient(160deg,#1c4a78,#0e2c4d);}

/* ---------- CARDS ---------- */
.card{
  width:104px; min-width:104px; height:142px; background:var(--paper); border-radius:9px;
  border:4px solid; padding:8px 7px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  position:relative; box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
.card.small{width:88px; min-width:88px; height:120px; padding:6px;}
.card.tablegraph{width:102px; min-width:102px; height:139px; padding:6px;}
.card .inner-line{width:88%; height:0; border-top:1px solid currentColor; opacity:0.5; margin:2px 0 4px;}
.card-title{font-family:'Inter'; font-weight:700; font-size:10.5px; text-align:center; letter-spacing:0.3px; line-height:1.15;}
.card.small .card-title{font-size:9px;}
.card-title-en{font-family:'Source Serif 4'; font-style:italic; font-size:9px; color:#8a8578; margin-top:1px;}
.card.small .card-title-en{font-size:8px;}
.card-content{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; width:100%;}
.card-func-name{font-family:'Fredoka'; font-weight:700; font-size:13px; line-height:1.15;}
.card.small .card-func-name{font-size:11px;}
.card-func-en{font-family:'Source Serif 4'; font-style:italic; font-size:9px; color:#8a8578; display:block; margin-top:3px; font-weight:400;}
.card-eq{font-family:'Source Serif 4'; font-style:italic; font-size:14px;}
.card.small .card-eq{font-size:12px;}
.frac{display:inline-flex; flex-direction:column; vertical-align:middle; line-height:1; margin:0 2px; font-size:0.82em; text-align:center;}
.frac .num{border-bottom:1.4px solid currentColor; padding:0 2px;}
.frac .den{padding:0 2px;}
.sqrt-inner{border-top:1.4px solid currentColor; padding:0 2px;}

.card.graph{border-color:var(--c-graph); color:var(--c-graph); padding:6px;}
.card.joker{border-color:var(--gold); padding:4px;}
.card.joker .jolly-img{width:100%; height:100%; object-fit:cover; border-radius:6px;}
.card.domain{border-color:var(--c-domain-table); color:var(--c-domain);}
.card.range{border-color:var(--c-range-table); color:var(--c-range);}
.card.equation{border-color:var(--c-equation-table); color:var(--c-equation);}
.card.function{border-color:var(--c-function); color:var(--c-function);}
.card.domain .card-content, .card.domain .card-eq{color:var(--c-domain);}
.card.range .card-content, .card.range .card-eq{color:var(--c-range);}
.card.equation .card-content, .card.equation .card-eq{color:var(--c-equation);}
.card.function .card-content{color:var(--c-function);}
.card svg{width:100%; height:100%;}

/* ---------- HAND ---------- */
.hand-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.hand-card{cursor:grab; touch-action:none; user-select:none;}
.hand-card:active{cursor:grabbing;}
.hand-card.dragging-origin{opacity:0.28;}
.drag-ghost{transform:scale(1.08) rotate(-2deg); box-shadow:0 16px 34px rgba(0,0,0,0.55); transition:none !important;}

.slot{transition:outline 0.12s, transform 0.12s;}
.slot.drag-hover-ok{outline:3px solid #3fd17c; outline-offset:3px; border-radius:16px; transform:scale(1.03);}
.slot.drag-hover-bad{outline:3px solid #e5484d; outline-offset:3px; border-radius:16px;}
.slot.shake-bad{animation:shakeBad 0.42s;}
@keyframes shakeBad{
  10%,90%{transform:translateX(-5px);} 20%,80%{transform:translateX(7px);}
  30%,50%,70%{transform:translateX(-9px);} 40%,60%{transform:translateX(9px);}
}

.you-panel{
  background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:16px; margin-top:16px;
}
.you-header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;}
.hint{font-size:12.5px; color:var(--chalk-dim);}
.btn{
  font-family:'Inter'; font-weight:700; font-size:13px; border:none; border-radius:999px; padding:11px 20px;
  cursor:pointer; background:linear-gradient(135deg,var(--gold),#d99420); color:#231600; box-shadow:0 4px 14px rgba(240,180,41,0.35);
  transition:transform 0.15s;
}
.btn:hover{transform:translateY(-2px);}
.btn.secondary{background:rgba(255,255,255,0.1); color:#fff; box-shadow:none;}
.btn.ghost{background:transparent; border:1.5px solid rgba(255,255,255,0.25); color:#fff; box-shadow:none;}

.log{font-size:12.5px; color:var(--chalk-dim); min-height:18px; margin-top:8px; text-align:center;}

/* ---------- OVERLAYS ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(6,14,26,0.86); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  background:linear-gradient(160deg,#0f2a47,#0a1c30); border:1px solid rgba(255,255,255,0.12);
  border-radius:22px; padding:34px 30px; max-width:460px; width:100%; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal h2{font-family:'Luckiest Guy',cursive; font-weight:400; font-size:30px; margin:10px 0 6px; color:#fff; letter-spacing:0.5px; text-shadow:2px 2px 0 rgba(6,16,28,0.5);}

.hero-monster{
  width:132px; height:132px; border-radius:50%; margin:0 auto 6px;
  background-image:var(--monster-img); background-size:180%; background-position:50% 30%;
  border:4px solid rgba(240,180,41,0.55); box-shadow:0 0 0 6px rgba(255,255,255,0.05), 0 10px 26px rgba(0,0,0,0.45);
}
.type-strip{display:flex; justify-content:center; gap:6px; margin:14px 0;}
.type-strip span{width:26px;height:8px;border-radius:4px;}
.modal p{color:var(--chalk-dim); font-size:14px; line-height:1.6;}
.choice-row{display:flex; gap:10px; justify-content:center; margin:16px 0; flex-wrap:wrap;}
.choice-btn{
  background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.15); color:#fff;
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:'Inter'; font-weight:600; font-size:13px;
}
.choice-btn.active{border-color:var(--gold); background:rgba(240,180,41,0.15); color:var(--gold);}

.showcase{margin:16px 0 4px;}
.showcase-flanked{display:flex; align-items:center; justify-content:center; gap:6px;}
.showcase-legend{display:flex; flex-direction:column; gap:22px;}
.legend-item{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; opacity:0.9; width:44px;
}
.legend-item span{
  width:26px; height:26px; border-radius:8px; border:2px solid currentColor;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
}
.showcase-label{font-size:11px; letter-spacing:1.8px; text-transform:uppercase; color:var(--chalk-dim); font-weight:700; margin-bottom:12px;}
.showcase-card{display:flex; justify-content:center; margin-bottom:8px; animation:showcaseFade 0.4s ease;}
@keyframes showcaseFade{from{opacity:0; transform:scale(0.9) translateY(4px);} to{opacity:1; transform:scale(1) translateY(0);}}
.showcase-name{font-family:'Fredoka'; font-weight:700; font-size:15px; color:#fff; margin-bottom:10px;}
.showcase-name span{display:block; font-family:'Source Serif 4'; font-style:italic; font-weight:400; font-size:11px; color:var(--chalk-dim); margin-top:1px;}
.showcase-dots{display:flex; justify-content:center; gap:6px; flex-wrap:wrap;}
.showcase-dots .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.25); cursor:pointer; transition:background 0.2s, transform 0.2s;}
.showcase-dots .dot.active{background:var(--gold); transform:scale(1.35);}

.rules-box{
  text-align:left; background:rgba(255,255,255,0.04); border-radius:12px; padding:14px 16px; margin:14px 0;
  font-size:12.5px; line-height:1.65; color:var(--chalk);
}
.rules-box b{color:var(--gold);}

@media (max-width:600px){
  .card{width:90px; min-width:90px; height:124px;}

}

    grid-template-columns:repeat(4, minmax(150px, 190px));
    justify-content:center;
    gap:22px;

  .slot{
    flex-direction:column !important;
    justify-content:flex-start;
    gap:8px;
  }
  .match-pills{
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    max-width:150px;
  }
  .card.tablegraph{width:112px; min-width:112px; height:153px;}
}

/* ============ SVG GRAFICO ============ */
function renderGraphSVG(plot){
  const W=140,H=110,pad=16;
  const sx=(W-2*pad)/(plot.xMax-plot.xMin);
  const sy=(H-2*pad)/(plot.yMax-plot.yMin);
  const px=x=>pad+(x-plot.xMin)*sx;
  const py=y=>H-pad-(y-plot.yMin)*sy;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // assi
  if(plot.yMin<0 && plot.yMax>0){
    svg+=`<line x1="${pad-4}" y1="${py(0)}" x2="${W-pad+4}" y2="${py(0)}" stroke="#888" stroke-width="1"/>`;
    svg+=`<polygon points="${W-pad+4},${py(0)} ${W-pad-3},${py(0)-3} ${W-pad-3},${py(0)+3}" fill="#888"/>`;
  }
  if(plot.xMin<0 && plot.xMax>0){
    svg+=`<line x1="${px(0)}" y1="${H-pad+4}" x2="${px(0)}" y2="${pad-4}" stroke="#888" stroke-width="1"/>`;
    svg+=`<polygon points="${px(0)},${pad-4} ${px(0)-3},${pad+3} ${px(0)+3},${pad+3}" fill="#888"/>`;
  }
  // asintoto
  if(plot.asymptoteX!==undefined){
    svg+=`<line x1="${px(plot.asymptoteX)}" y1="${pad-4}" x2="${px(plot.asymptoteX)}" y2="${H-pad+4}" stroke="#c9c3b6" stroke-width="1" stroke-dasharray="3,3"/>`;
  }

  // genera valori di x con densità maggiore vicino a un estremo (per "abbracciare" un asintoto)
  function genX(x0,x1,bias,p,N){
    const xs=[];
    for(let i=0;i<=N;i++){
      const t=i/N;
      let x;
      if(bias==='start') x = x0 + (x1-x0)*Math.pow(t,p);
      else if(bias==='end') x = x1 - (x1-x0)*Math.pow(1-t,p);
      else x = x0 + (x1-x0)*t;
      xs.push(x);
    }
    return xs;
  }

  let segmentsX = [];
  if(plot.asymptoteX!==undefined){
    const a = plot.asymptoteX;
    if(a > plot.xMin && a < plot.xMax){
      const eps = (plot.xMax-plot.xMin)*0.004;
      segmentsX.push(genX(plot.xMin, a-eps, 'end', 4, 140));
      segmentsX.push(genX(a+eps, plot.xMax, 'start', 4, 140));
    } else if(a <= plot.xMin){
      segmentsX.push(genX(plot.xMin, plot.xMax, 'start', 4, 160));
    } else {
      segmentsX.push(genX(plot.xMin, plot.xMax, 'end', 4, 160));
    }
  } else {
    segmentsX.push(genX(plot.xMin, plot.xMax, 'none', 1, 140));
  }

  segmentsX.forEach(xs=>{
    let d=''; let started=false;
    xs.forEach(x=>{
      let y=plot.f(x);
      if(isNaN(y) || y<plot.yMin-2.5 || y>plot.yMax+2.5){ started=false; return; }
      const X=px(x), Y=py(Math.max(plot.yMin-1.5,Math.min(plot.yMax+1.5,y)));
      d+= started? ` L ${X.toFixed(1)} ${Y.toFixed(1)}` : ` M ${X.toFixed(1)} ${Y.toFixed(1)}`;
      started=true;
    });
    if(d) svg+=`<path d="${d}" fill="none" stroke="#d4213d" stroke-width="2.4" stroke-linecap="round"/>`;
  });

  if(plot.startDot){
    svg+=`<circle cx="${px(plot.startDot[0])}" cy="${py(plot.startDot[1])}" r="3" fill="#d4213d"/>`;
  }
  if(plot.vertexDot){
    svg+=`<circle cx="${px(plot.vertexDot[0])}" cy="${py(plot.vertexDot[1])}" r="3" fill="#d4213d"/>`;
    svg+=`<text x="${px(plot.vertexDot[0])+5}" y="${py(plot.vertexDot[1])-4}" font-size="8" fill="#333">(${plot.vertexDot[0]}, ${plot.vertexDot[1]})</text>`;
  }
  if(plot.flatLabel){
    svg+=`<text x="${px(0)+4}" y="${py(2)-4}" font-size="9" fill="#333" font-weight="700">${plot.flatLabel}</text>`;
  }
  svg+='</svg>';
  return svg;
}

/* ============ COSTRUZIONE MAZZO ============ */
function buildDeck(){
  let deck=[]; let cid=0;
  FUNCS.forEach(fn=>{
    ['graph','domain','range','equation','function'].forEach(type=>{
      deck.push({id:cid++, funcId:fn.id, type});
    });
  });
  return deck;
}
function buildJokers(){
  return [{id:9001, type:'joker', funcId:null}, {id:9002, type:'joker', funcId:null}];
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ============ RENDER CARTA ============ */
function cardHTML(card, size){
  const sizeClass = size==='small' ? ' small' : (size==='tablegraph' ? ' tablegraph' : '');
  if(card.type==='joker'){
    return `<div class="card joker${sizeClass}"><img src="${JOLLY_IMG}" alt="Jolly" class="jolly-img"/></div>`;
  }
  const fn=FUNCS[card.funcId];
  if(card.type==='graph'){
    return `<div class="card graph${sizeClass}">${renderGraphSVG(fn.plot)}</div>`;
  }
  let title, content;
  if(card.type==='domain'){ title='DOMINIO'; var titleEn='Domain'; content=`<span class="card-eq">${fn.domHTML}</span>`; }
  if(card.type==='range'){ title='INSIEME IMMAGINE'; var titleEn='Range'; content=`<span class="card-eq">${fn.rngHTML}</span>`; }
  if(card.type==='equation'){ title='EQUAZIONE'; var titleEn='Equation'; content=`<span class="card-eq">${fn.eqHTML}</span>`; }
  if(card.type==='function'){ title='TIPO DI FUNZIONE'; var titleEn='Function'; content=`<span class="card-func-name">${fn.nome}<span class="card-func-en">${fn.nomeEn}</span></span>`; }
  return `<div class="card ${card.type}${sizeClass}">
    <div class="card-title">${title}<div class="card-title-en">${titleEn}</div></div>
    <div class="inner-line"></div>
    <div class="card-content">${content}</div>
  </div>`;
}

/* ============ STATO DI GIOCO ============ */
let state = null;

function newGame(starter){
  stopCarousel();
  const deck = shuffle(buildDeck());
  const graphCards = shuffle(deck.filter(c=>c.type==='graph'));
  const otherCards = shuffle(deck.filter(c=>c.type!=='graph'));
  const table = graphCards.slice(0,4).map(g=>({graph:g, filled:{domain:null,range:null,equation:null,function:null}}));
  const graphPile = graphCards.slice(4);
  const you=[], computer=[];
  for(let i=0;i<5;i++){ you.push(otherCards.pop()); computer.push(otherCards.pop()); }
  const drawPile = shuffle(otherCards.concat(buildJokers()));
  state = {
    table, graphPile, drawPile,
    hands:{you, computer},
    current: starter,
    log:'Si comincia! Buona fortuna. 🃏 I due Jolly nel mazzo capiteranno solo a te.',
    over:false, winner:null,
    busy: starter!=='you', drawnThisTurn:false,
    cardsPlayed:0, cardsAllowed:1, bonusPending:false, computerReveal:null, wrongAttempts:0, doubleErrorFlash:false, computerDrawing:false, confirmExit:false
  };
  render();
  if(starter==='computer') setTimeout(computerTurn, 900);
}

function startTurn(who){
  state.current = who;
  state.cardsPlayed = 0;
  state.wrongAttempts = 0;
  if(who==='you' && state.bonusPending){
    state.cardsAllowed = 2;
    state.bonusPending = false; // il bonus è usato solo da te, per il computer resta "in sospeso" fino al tuo turno
  } else {
    state.cardsAllowed = 1;
  }
  state.drawnThisTurn = false;
  state.busy = (who!=='you');
}

function valueMatches(card, slot){
  const cardFn = FUNCS[card.funcId];
  const slotFn = FUNCS[slot.graph.funcId];
  if(card.type==='domain') return cardFn.domHTML === slotFn.domHTML;
  if(card.type==='range') return cardFn.rngHTML === slotFn.rngHTML;
  if(card.type==='equation') return cardFn.eqHTML === slotFn.eqHTML;
  if(card.type==='function') return cardFn.nome === slotFn.nome;
  return false;
}
function cardMatchesSlot(card, slot, who){
  who = who || 'you';
  if(card.type==='joker'){
    return TYPES.some(t=>slot.filled[t]===null);
  }
  const occupant = slot.filled[card.type];
  if(occupant===null) return valueMatches(card, slot);
  if(occupant.type==='joker' && who==='you') return valueMatches(card, slot);
  return false; // casella già occupata da una carta vera, o Jolly che il computer non può toccare
}
function findPlayable(hand, table, who){
  who = who || 'you';
  return hand.filter(card=> table.some(slot=> cardMatchesSlot(card, slot, who)));
}
function popNonJokerForComputer(){
  let attempts = 0;
  while(state.drawPile.length>0 && attempts<80){
    const card = state.drawPile.pop();
    if(card.type!=='joker') return card;
    const reinsertAt = Math.floor(Math.random()*(state.drawPile.length+1));
    state.drawPile.splice(reinsertAt, 0, card);
    attempts++;
  }
  return null;
}
function playCard(who, card, targetSlot, pillType){
  const hand = state.hands[who];
  const idx = hand.findIndex(c=>c.id===card.id);
  if(idx===-1) return false;
  const slot = targetSlot && cardMatchesSlot(card, targetSlot, who) ? targetSlot : state.table.find(s=> cardMatchesSlot(card, s, who));
  if(!slot) return false;

  if(card.type==='joker'){
    const type = (pillType && slot.filled[pillType]===null) ? pillType : TYPES.find(t=>slot.filled[t]===null);
    if(!type) return false;
    hand.splice(idx,1);
    slot.filled[type] = card;
  } else {
    const occupant = slot.filled[card.type];
    hand.splice(idx,1);
    if(occupant && occupant.type==='joker' && who==='you'){
      state.hands[who].push(occupant); // riprendi il Jolly in mano
    }
    slot.filled[card.type] = card;
    slot._justFilled = card.type;
  }
  const complete = TYPES.every(t=>slot.filled[t]!==null);
  if(complete) slot._complete = true;
  return true;
}
function resolveCompletedSlots(cb){
  const done = state.table.filter(s=>s._complete);
  if(done.length===0){ cb(); return; }
  state.bonusPending = true;
  state.log += ' 🎁 Set completato! Il tuo prossimo turno varrà 2 carte.';
  render(); // mostra animazione "completing"
  setTimeout(()=>{
    if(!state) return;
    state.table = state.table.map(s=>{
      if(!s._complete) return s;
      if(state.graphPile.length>0){
        return {graph:state.graphPile.pop(), filled:{domain:null,range:null,equation:null,function:null}, _arriving:true};
      }
      return null;
    }).filter(Boolean);
    render();
    setTimeout(()=>{ if(state) state.table.forEach(s=>{ delete s._arriving; delete s._complete; }); }, 550);
    cb();
  }, 650);
}

function checkWin(){
  if(state.hands.you.length===0){ state.over=true; state.winner='you'; }
  else if(state.hands.computer.length===0){ state.over=true; state.winner='computer'; }
}

function humanPlaySlot(card, slot, pillType){
  if(state.busy || state.current!=='you' || state.over) return false;
  if(card.type==='joker'){
    if(!pillType || slot.filled[pillType]!==null) return false;
  } else {
    pillType = card.type;
    if(!cardMatchesSlot(card, slot, 'you')) return false;
  }
  const wasJokerSwap = card.type!=='joker' && slot.filled[pillType] && slot.filled[pillType].type==='joker';
  const played = playCard('you', card, slot, pillType);
  if(!played) return false;
  state.cardsPlayed++;
  const bonusLeft = state.cardsPlayed < state.cardsAllowed;
  if(card.type==='joker'){
    state.log = '🃏 Jolly piazzato! Chi avrà la carta giusta potrà toglierlo e riprenderselo.';
  } else if(wasJokerSwap){
    state.log = '🃏 Hai sostituito il Jolly con la carta corretta e l\'hai ripreso in mano!';
  } else {
    state.log = bonusLeft ? 'Piazzata giusta! Turno bonus: piazzane un\'altra! 🎯✨' : 'Piazzata giusta! 🎯';
  }
  state.busy = true;
  resolveCompletedSlots(()=>{
    checkWin();
    if(state.over){ render(); return; }
    if(state.cardsPlayed < state.cardsAllowed){
      state.busy = false;
      render();
    } else {
      startTurn('computer');
      render();
      setTimeout(computerTurn, 850);
    }
  });
  render();
  return true;
}

function humanDraw(){
  if(state.busy || state.current!=='you' || state.over || state.drawnThisTurn) return;
  const playable = findPlayable(state.hands.you, state.table);
  if(playable.length>0){
    state.log = 'Hai ancora una carta valida in mano: prova a trascinarla su un grafico prima di pescare!';
    render();
    return;
  }
  if(state.drawPile.length===0){
    state.busy = true;
    state.log = 'Il mazzo di pesca è vuoto: turno saltato.';
    render();
    startTurn('computer'); render();
    setTimeout(computerTurn, 850);
    return;
  }
  const card = state.drawPile.pop();
  state.hands.you.push(card);
  state.drawnThisTurn = true;
  if(card.type==='joker'){
    state.log = '🃏 Hai pescato un Jolly! Trascinalo su una qualsiasi casella libera del tavolo, oppure premi "Pesca una carta".';
    render();
    return;
  }
  const canPlay = state.table.some(slot=> cardMatchesSlot(card, slot, 'you'));
  if(canPlay){
    state.log = 'Hai pescato una carta che potrebbe servire! Trascinala sul grafico giusto, oppure premi "Pesca una carta".';
    render();
  } else {
    state.busy = true;
    state.log = 'Hai pescato una carta non abbinabile. Turno al computer.';
    render();
    startTurn('computer'); render();
    setTimeout(computerTurn, 850);
  }
}

function humanEndTurn(){
  if(state.busy || state.current!=='you' || state.over || !state.drawnThisTurn) return;
  state.log = 'Fine turno.';
  render();
  startTurn('computer');
  render();
  setTimeout(computerTurn, 850);
}

function computerTurn(){
  if(!state || state.over) return;
  const playable = findPlayable(state.hands.computer, state.table, 'computer');
  if(playable.length>0){
    const card = playable[Math.floor(Math.random()*playable.length)];
    const slot = state.table.find(s=>cardMatchesSlot(card, s, 'computer'));
    revealComputerCard(card, slot, ()=>{
      playCard('computer', card, slot);
      state.cardsPlayed++;
      state.log = 'Il computer piazza una carta. 🤖';
      resolveCompletedSlots(()=>{
        checkWin();
        if(state.over){ render(); return; }
        if(state.cardsPlayed < state.cardsAllowed){
          render();
          setTimeout(computerTurn, 750);
        } else {
          finishComputerTurn();
        }
      });
      render();
    });
  } else if(state.drawPile.length>0 && !state.drawnThisTurn){
    state.drawnThisTurn = true;
    state.computerDrawing = true;
    state.log = 'Il computer sta pescando una carta... 🤖🎴';
    render();
    setTimeout(()=>{
      if(!state) return;
      state.computerDrawing = false;
      const card = popNonJokerForComputer();
      if(!card){
        state.log = 'Il computer non trova carte da pescare.';
        finishComputerTurn();
        render();
        return;
      }
      state.hands.computer.push(card);
      const slot = state.table.find(s=>cardMatchesSlot(card, s, 'computer'));
      if(slot){
        state.log = 'Il computer pesca... e trova la carta giusta! 🤖';
        render();
        revealComputerCard(card, slot, ()=>{
          playCard('computer', card, slot);
          state.cardsPlayed++;
          state.log = 'Il computer pesca... e piazza subito! 🤖';
          resolveCompletedSlots(()=>{
            checkWin();
            if(state.over){ render(); return; }
            if(state.cardsPlayed < state.cardsAllowed){
              render();
              setTimeout(computerTurn, 750);
            } else {
              finishComputerTurn();
            }
          });
          render();
        });
      } else {
        state.log = 'Il computer pesca una carta.';
        finishComputerTurn();
        render();
      }
    }, 1300);
  } else {
    state.log = state.drawnThisTurn ? 'Il computer non ha altre mosse disponibili.' : 'Mazzo vuoto: il computer salta il turno.';
    finishComputerTurn();
    render();
  }
}

/* Mostra per bene in evidenza la carta che il computer sta per piazzare, poi esegue il callback */
function revealComputerCard(card, slot, onDone){
  state.computerReveal = { card, funcId: slot.graph.funcId };
  render();
  setTimeout(()=>{
    if(!state) return;
    state.computerReveal = null;
    onDone();
  }, 1900);
}

function finishComputerTurn(){
  if(!state || state.over){ if(state) render(); return; }
  startTurn('you');
  render();
}

/* ============ TRASCINAMENTO CARTE (mouse + touch) ============ */
let dragState = null;

function onCardPointerDown(e){
  if(state.busy || state.current!=='you' || state.over) return;
  const cardEl = e.currentTarget;
  const cardId = Number(cardEl.getAttribute('data-hand-card'));
  const card = state.hands.you.find(c=>c.id===cardId);
  if(!card) return;
  e.preventDefault();
  const rect = cardEl.getBoundingClientRect();
  const ghost = cardEl.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.position='fixed';
  ghost.style.left=rect.left+'px';
  ghost.style.top=rect.top+'px';
  ghost.style.width=rect.width+'px';
  ghost.style.height=rect.height+'px';
  ghost.style.margin='0';
  ghost.style.zIndex='9999';
  ghost.style.pointerEvents='none';
  document.body.appendChild(ghost);
  cardEl.classList.add('dragging-origin');

  dragState = {
    card, cardEl, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top
  };
  document.addEventListener('pointermove', onCardPointerMove);
  document.addEventListener('pointerup', onCardPointerUp, {once:true});
}

function onCardPointerMove(e){
  if(!dragState) return;
  dragState.ghost.style.left = (e.clientX - dragState.offsetX)+'px';
  dragState.ghost.style.top = (e.clientY - dragState.offsetY)+'px';
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('drag-hover-ok','drag-hover-bad'));
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drag-hover-ok','drag-hover-bad'));
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const pillEl = under ? under.closest('.pill') : null;
  if(pillEl){
    const graphId = Number(pillEl.getAttribute('data-slot-graphid'));
    const slot = state.table.find(s=>s.graph.id===graphId);
    const pillType = pillEl.getAttribute('data-pill-type');
    let ok = false;
    if(slot){
      if(dragState.card.type==='joker') ok = slot.filled[pillType]===null;
      else ok = pillType===dragState.card.type && cardMatchesSlot(dragState.card, slot, 'you');
    }
    pillEl.classList.add(ok?'drag-hover-ok':'drag-hover-bad');
    return;
  }
  const slotEl = under ? under.closest('.slot') : null;
  if(slotEl){
    const graphId = Number(slotEl.getAttribute('data-slot-graphid'));
    const slot = state.table.find(s=>s.graph.id===graphId);
    if(slot){
      const ok = dragState.card.type==='joker' ? false : cardMatchesSlot(dragState.card, slot, 'you');
      slotEl.classList.add(ok ? 'drag-hover-ok' : 'drag-hover-bad');
    }
  }
}

function onCardPointerUp(e){
  document.removeEventListener('pointermove', onCardPointerMove);
  if(!dragState) return;
  const { card, cardEl, ghost } = dragState;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('drag-hover-ok','drag-hover-bad'));
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drag-hover-ok','drag-hover-bad'));

  let slot=null, pillType=null, viaPill=false, targetEl=null;
  const pillEl = under ? under.closest('.pill') : null;
  if(pillEl){
    const graphId = Number(pillEl.getAttribute('data-slot-graphid'));
    slot = state.table.find(s=>s.graph.id===graphId);
    pillType = pillEl.getAttribute('data-pill-type');
    viaPill = true;
    targetEl = pillEl;
  } else {
    const slotEl = under ? under.closest('.slot') : null;
    if(slotEl){
      const graphId = Number(slotEl.getAttribute('data-slot-graphid'));
      slot = state.table.find(s=>s.graph.id===graphId);
      targetEl = slotEl;
    }
  }

  let placed = false;
  if(slot){
    if(card.type==='joker'){
      if(viaPill && pillType && slot.filled[pillType]===null){
        placed = humanPlaySlot(card, slot, pillType);
      } else if(viaPill){
        targetEl.classList.add('shake-bad');
        setTimeout(()=>targetEl.classList.remove('shake-bad'), 420);
        registerFailedAttempt('Questa casella è già occupata. ❌');
      } else {
        targetEl.classList.add('shake-bad');
        setTimeout(()=>targetEl.classList.remove('shake-bad'), 420);
        registerFailedAttempt('🃏 Rilascia il Jolly esattamente sopra la casellina (D/R/E/F) che vuoi occupare, non sull\'immagine del grafico.');
      }
    } else {
      const typeOk = viaPill ? pillType===card.type : true;
      if(typeOk && cardMatchesSlot(card, slot, 'you')){
        placed = humanPlaySlot(card, slot, card.type);
      } else {
        targetEl.classList.add('shake-bad');
        setTimeout(()=>targetEl.classList.remove('shake-bad'), 420);
        registerFailedAttempt('Questa carta non è quella giusta per questo grafico. ❌');
      }
    }
  }
  ghost.remove();
  cardEl.classList.remove('dragging-origin');
  dragState = null;
  if(!placed) render();
}

/* Conta i tentativi di posizionamento sbagliati: dopo 2 nello stesso turno, il turno viene saltato */
function playErrorSound(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    [0, 0.16].forEach((offset)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, now+offset);
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.14, now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.16);
    });
  }catch(e){ /* audio non disponibile, ignora silenziosamente */ }
}

function registerFailedAttempt(msg){
  if(state.busy) return; // il turno sta già per finire, non contare altri tentativi
  state.wrongAttempts = (state.wrongAttempts||0) + 1;
  if(state.wrongAttempts >= 2){
    state.log = msg + ' ⛔ Due tentativi sbagliati in questo turno: il turno passa al computer!';
    state.busy = true;
    state.doubleErrorFlash = true;
    playErrorSound();
    render();
    setTimeout(()=>{
      if(!state) return;
      state.doubleErrorFlash = false;
      startTurn('computer');
      render();
      setTimeout(computerTurn, 850);
    }, 900);
  } else {
    state.log = msg + ' Riprova — attenzione: un altro tentativo sbagliato e salti il turno!';
  }
}

function endOverlayHTML(){
  const youWin = state.winner==='you';
  return `<div class="overlay">
    <div class="modal">
      ${youWin? `<div style="font-size:44px;">🎉</div>` : `<div class="hero-monster" style="width:100px;height:100px;"></div>`}
      <h2>${youWin? 'Hai vinto!' : 'Vince il computer!'}</h2>
      <p>${youWin? 'Hai abbinato tutte le tue carte prima del computer. Ottimo lavoro con domini e insiemi immagine!' : 'Il computer è rimasto senza carte per primo. Rigioca per riprovare!'}</p>
      <button class="btn" data-newgame>Gioca ancora</button>
    </div>
  </div>`;
}

/* ============ SCHERMATA INIZIALE ============ */
let starterChoice = 'you';
let carouselIndex = 0;
let carouselTimer = null;

function showcaseInnerHTML(){
  const fn = FUNCS[carouselIndex];
  const graphCard = {type:'graph', funcId: fn.id};
  return `
    <div class="showcase-card">${cardHTML(graphCard,'tablegraph')}</div>
    <div class="showcase-name">${fn.nome}<span>${fn.nomeEn}</span></div>
    <div class="showcase-dots">${FUNCS.map((f,i)=>`<span class="dot ${i===carouselIndex?'active':''}" data-dot="${i}"></span>`).join('')}</div>
  `;
}
function updateCarouselDOM(){
  const wrap = document.getElementById('showcase-wrap');
  if(!wrap) return;
  wrap.innerHTML = showcaseInnerHTML();
  wrap.querySelectorAll('[data-dot]').forEach(d=>{
    d.addEventListener('click', ()=>{
      carouselIndex = Number(d.getAttribute('data-dot'));
      updateCarouselDOM();
      startCarousel();
    });
  });
}
function startCarousel(){
  if(carouselTimer){ clearInterval(carouselTimer); }
  carouselTimer = setInterval(()=>{
    carouselIndex = (carouselIndex+1) % FUNCS.length;
    updateCarouselDOM();
  }, 2200);
}
function stopCarousel(){
  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer=null; }
}
